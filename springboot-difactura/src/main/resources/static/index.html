<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Factura</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: white; }
    table { border-collapse: collapse; width: 60%; margin-top: 15px; }
    th, td { border: 1px solid #aaa; padding: 8px; text-align: left; }
  </style>
</head>
<body class="bg-dark text-white">
    <header class="container text-center text-white">
    </header>
    <main>
        <section>
            <article  class="container text-center">
                    <h1>Informe detallado del cliente.</h1>
                    <h2>Factura del cliente Andres Garcia</h2>
                    <br/>
                    <button id="btn" class="btn btn-light">Mostrar Factura</button>
            </article>
            <article>
                <div id="factura"></div>
                <script>
                    document.getElementById("btn").addEventListener("click", () => {
                    fetch("/invoices/show")   // tu endpoint del controller
                        .then(resp => {
                        if (!resp.ok) throw new Error("Error: " + resp.status);
                        return resp.json();
                        })
                        .then(data => {
                        // Construyo HTML
                        let html = `
                            <br/>
                            <p class = "container text center"><strong>Cliente:</strong> ${data.client.name} ${data.client.lastname}</p>
                            <p class = "container text center"><strong>Descripción:</strong> ${data.description}</p>
                            <h3 class="container text-center">Items</h3>
                            <table class="container text-center">
                            <tr>
                                <th>Item</th>
                                <th>Producto</th>
                                <th>Precio</th>
                                <th>Cantidad</th>
                                <th>Subtotal</th>
                            </tr>
                        `;

                        let total = 0;
                        let cont = 0;
                        data.items.forEach(item => {
                            let subtotal = item.product.price * item.quantity;
                            total += subtotal;
                            html += `
                            <tr>
                                <td>${++cont}</td>
                                <td>${item.product.name}</td>
                                <td>${item.product.price} €</td>
                                <td>${item.quantity}</td>
                                <td>${subtotal} €</td>
                            </tr>
                            `;
                        });

                        html += `
                            <tr>
                                <td colspan="4"><strong>Total</strong></td>
                                <td><strong>${total} €</strong></td>
                            </tr>
                            </table>
                        `;

                        document.getElementById("factura").innerHTML = html;
                        })
                        .catch(err => {
                        document.getElementById("factura").innerHTML = `<p style="color:red;">${err.message}</p>`;
                        });
                    });
                </script>
            </article>
        </section>
        <footer class="container text-center">
        </footer>
  </main>
</body>
</html>
